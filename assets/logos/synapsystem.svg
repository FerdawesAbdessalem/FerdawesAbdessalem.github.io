<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4338CA"/><stop offset="0.55" stop-color="#6366F1"/><stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FDE68A"/><stop offset="1" stop-color="#FDE68A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <!-- neurone haut : du noyau vers la synapse (moitié haute du S) -->
  <path d="M43 15.5C37 11 22 11.5 20.5 20.5c-1 6.2 5 8.8 10 10" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
  <!-- neurone bas : de la synapse vers le noyau (moitié basse du S) -->
  <path d="M34 33.5c5 2.2 11 4.8 9.6 11C42 52.5 27 53 21 48.5" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity="0.92"/>
  <!-- noyaux (corps cellulaires) -->
  <circle cx="45" cy="16.5" r="5" fill="#fff"/><circle cx="45" cy="16.5" r="2" fill="#4F46E5"/>
  <circle cx="19" cy="47.5" r="5" fill="#fff"/><circle cx="19" cy="47.5" r="2" fill="#0891B2"/>
  <!-- fente synaptique et neurotransmetteurs -->
  <circle cx="32.2" cy="32" r="7" fill="url(#glow)"/>
  <circle cx="30.4" cy="31.2" r="1.4" fill="#FEF3C7"/><circle cx="33.4" cy="30.2" r="1.1" fill="#FEF3C7"/><circle cx="33.2" cy="33.4" r="1.2" fill="#FEF3C7"/>
</svg>
